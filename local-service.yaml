services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: merchantposDev
      POSTGRES_PASSWORD: merchantpos@dev!
      POSTGRES_DB: merchantpos
    ports:
      - "5432:5432"
    volumes:
      - ./local-service-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - ./local-service-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  centrifugo:
    image: centrifugo/centrifugo:v5
    restart: unless-stopped
    ports:
      - "9000:9000" # HTTP API + WebSocket
      - "15000:15000" # gRPC API
    volumes:
      - ./local-service-data/centrifugo:/centrifugo/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

